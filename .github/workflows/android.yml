name: Android candidate APK

# Native builds are deliberately manual. Source checks run on pushes and PRs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build components
        run: >-
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Install locked dependencies
        run: npm ci
      - name: Check the source before building
        run: |
          npm run typecheck
          npm test
      - name: Build and verify the development-signed release candidate
        run: bash scripts/build-android.sh
      - name: Retain APK, hashes and static verification reports
        uses: actions/upload-artifact@v4
        with:
          name: belem-android-candidate-${{ github.run_number }}
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 14
